# Sobe toda a solução: 6 microsserviços + React (8000) + Flutter Web (8100).
# Uso: cd backend && docker compose up --build
#
# Todos os serviços leem backend/.env (env_file). Como cada serviço usa um banco
# diferente, o DB_NAME é definido por serviço em `environment`, que tem
# prioridade sobre o env_file.
services:
  catalogo:
    build: ./listagem_produtos
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      DB_NAME: listagem_produtos
      BARRAMENTO_URL: http://barramento:10000
    ports:
      - "8001:8001"

  auth:
    build: ./autenticacao
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      BARRAMENTO_URL: http://barramento:10000
    ports:
      - "8002:8002"

  carrinho:
    build: ./carrinho
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      DB_NAME: carrinho
      BARRAMENTO_URL: http://barramento:10000
    ports:
      - "8003:8003"

  pagamento:
    build: ./pagamento
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
    ports:
      - "8004:8004"

  assinatura:
    build: ./assinatura
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      DB_NAME: carrinho
      BARRAMENTO_URL: http://barramento:10000
    ports:
      - "8005:8005"

  barramento:
    build: ./barramento
    env_file: ./.env
    environment:
      HOST: 0.0.0.0
      CATALOGO_URL: http://catalogo:8001
      AUTH_URL: http://auth:8002
      RESERVA_URL: http://carrinho:8003
    ports:
      - "10000:10000"

  # O navegador chama os serviços direto, pelas portas publicadas acima
  # (os endereços http://localhost:800X já são o padrão das duas interfaces).
  frontend:
    build: ../frontend
    ports:
      - "8000:80"

  flutter:
    build: ../flutter_app
    ports:
      - "8100:80"
