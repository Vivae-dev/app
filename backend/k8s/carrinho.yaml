apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrinho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carrinho
  template:
    metadata:
      labels:
        app: carrinho
    spec:
      enableServiceLinks: false
      containers:
        - name: carrinho
          image: backend-carrinho
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: DB_NAME
              value: carrinho
            - name: BARRAMENTO_URL
              value: http://barramento:10000
---
apiVersion: v1
kind: Service
metadata:
  name: carrinho
spec:
  selector:
    app: carrinho
  ports:
    - port: 8003
      targetPort: 8003
