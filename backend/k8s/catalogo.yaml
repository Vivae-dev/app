apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      enableServiceLinks: false
      containers:
        - name: catalogo
          image: backend-catalogo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: HOST
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: catalogo
spec:
  selector:
    app: catalogo
  ports:
    - port: 8001
      targetPort: 8001
