apiVersion: apps/v1
kind: Deployment
metadata:
  name: assinatura
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assinatura
  template:
    metadata:
      labels:
        app: assinatura
    spec:
      enableServiceLinks: false
      containers:
        - name: assinatura
          image: backend-assinatura
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: BARRAMENTO_URL
              value: http://barramento:10000
---
apiVersion: v1
kind: Service
metadata:
  name: assinatura
spec:
  selector:
    app: assinatura
  ports:
    - port: 8005
      targetPort: 8005
